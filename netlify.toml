# Configuración de despliegue en Netlify
# No requiere variables de entorno ni servicios externos.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Versión de Node compatible con Vite 8 y Jest 30 (Vite 8 requiere Node >= 22.12).
  NODE_VERSION = "22"

# Fallback SPA: cualquier ruta inexistente sirve index.html.
# Sin `force`, los archivos reales (JS, CSS, favicon) se sirven normalmente.
# Se define solo aquí (no en public/_redirects) para evitar reglas duplicadas.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad para todo el sitio.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Los recursos generados por Vite llevan hash en el nombre: se pueden cachear de forma permanente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
